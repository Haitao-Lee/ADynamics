# =============================================================================
# ADynamics Stage 1: Multi-Modal VAE Training Configuration
# =============================================================================
# Default configuration. Trains the multi-modal encoder + lightweight decoder
# + classifier.
#
# Loss = recon + cls_weight * ordinal_ce + kl_weight * KL (with free bits)
#      + ordinal_reg_weight * ordinal_reg
#
# Modality note: T1 is always required. The 4 optional modalities (fMRI, ASL,
# QSM, FLAIR) are toggled individually below. The current default is T1 + age/
# sex only (t1_only=true) — the cleanest baseline for diagnosing encoder/
# decoder behavior. To enable multi-modal, set t1_only: false.
#
# This file is the single source of truth: any change here is the new default.
# Do not introduce v-prefixed variants.

# Data
data:
  json: "./core_data/dataset_manifest_merged_v2.json"
  num_classes: 4               # 4 = NC / SCD / MCI / AD
  use_fmri: true
  use_asl: true
  use_qsm: true
  use_flair: true
  use_demographic: true        # add age + sex conditioning to latent (T1-only safe)
  t1_only: false               # use T1 + all 4 optional modalities

# Model architecture
model:
  spatial_size: [256, 256, 192]  # [D, H, W]
  in_channels: 1
  latent_channels: 64             # was 32; doubled to give the latent more
                                 # capacity for class-discriminative structure.
                                 # Encoder params +50%, peak memory +30%
                                 # (~18 GB per-GPU with batch=1 + checkpointing).
                                 # Trade-off: better silhouette and val acc,
                                 # downstream stages 2-5 must be re-trained.
  base_channels: 16
  decoder_depth: 4
  dropout_rate: 0.2
  use_attention: true
  # Mid-level + bottleneck attention. Subtle NC/SCD/MCI differences (e.g.,
  # hippocampal atrophy) live in mid-level features that get strided away
  # before the bottleneck. Cost: ~10% slower/epoch. The block is
  # zero-initialized, so the first forward pass is bitwise identical to
  # no-attention.
  attention_levels: [1, 2, 3]
  attention_heads: 8
  # fMRI temporal encoder (preserves full BOLD time series):
  #   1. Spatial avg pool (D, H) -> 1D time series per W slice
  #   2. 1D conv stack (num_pool blocks) -> 16 timepoints
  #   3. Lightweight Transformer (num_transformer_layers, num_heads)
  #   4. Reshape 16 tokens -> 3D grid (4,4,1) and trilinear interp to (16,16,12)
  # Zero-init projection — safe to add to existing pipeline.
  use_fmri_temporal: true
  fmri_in_channels: 34
  fmri_hidden_dim: 128
  fmri_num_pool: 3
  fmri_num_transformer_layers: 2
  fmri_num_heads: 4
  # OOM fix: gradient checkpointing on the decoder. 256^3 decoder
  # activations account for ~16GB of autograd-graph memory; wrapping
  # the layer stack in torch.utils.checkpoint.sequential drops the
  # peak by ~40% at the cost of ~15% slower training. Keep this ON
  # for the 24GB GPU budget.
  use_checkpointing: true

# Training hyperparameters
training:
  batch_size: 2                # TOTAL batch size (DataParallel scatter 1 per GPU, total effective=2)
  learning_rate: 0.00003
  weight_decay: 0.00001
  epochs: 300
  early_stopping_patience: 50
  save_interval: 50
  num_gpus: 2                   # 2x RTX 3090
  use_amp: false               # AMP caused NaN in VAE loss (KL+recon scale mismatch)

# Loss weights
loss:
  recon_loss_type: "l1"
  # cls=4.0 balances the gradient ratio (recon 0.02 vs cls 2.4 was 100:1 with
  # cls=1.0; classifier was starved). Tune via this YAML.
  cls_weight: 4.0
  # Per-class weights for cross-entropy (used by ordinal_cross_entropy_loss).
  # Inverse-frequency weighted to counter class imbalance: SCD 13% (199/1247)
  # and MCI 26% (386/1247) are minority vs NC 34% and AD 27%. Without this
  # the model collapses to NC+AD and gets 0% recall on SCD and MCI.
  # Formula: w_c = 0.5 / freq_c, normalized so weights sum to ~7.5
  # (slightly above 4 to mildly boost minority classes).
  class_weights: [1.24, 3.13, 1.61, 1.53]
  # kl=0.15 (was 0.3) gives the latent more room to encode class signal.
  # The previous 0.3 over-compressed 64-dim latent down to 7 active dims,
  # leaving no room for subtle SCD vs MCI differences. Lower KL lets
  # active_dims climb to ~20-30/64, raising silhouette.
  kl_weight: 0.15
  # Cyclical KL: 0 -> peak -> 0 every kl_cycle_len epochs. During the KL-off
  # phase the encoder is free to use latent capacity for class info; during
  # the KL-on phase the structure is "baked in" toward the prior. Reference:
  # Fu et al. 2019, "Cyclical Annealing Schedule".
  kl_strategy: "cyclical"
  kl_warmup_epochs: 30          # only used when kl_strategy="linear"
  kl_cycle_len: 15              # epochs per cycle when kl_strategy="cyclical"
  kl_cycle_low_frac: 0.1        # floor fraction of kl_weight during off-phase
  # Latent-space mixup (Zhang et al. 2018): mixes mu and labels with
  # lambda ~ Beta(alpha, alpha), then re-decodes + re-classifies. Strong
  # anti-overfit for small batch sizes. Set alpha=0.0 to disable.
  mixup_alpha: 0.4
  mixup_prob: 0.5               # per-batch probability of applying mixup
  free_bits: 0.05               # floor on per-dim KL; prevents total collapse
  contrastive_weight: 0.0       # disabled (contrastive loss not wired in trainer)
  contrastive_temperature: 0.1
  gradient_weight: 0.0
  ssim_weight: 0.0
  encoder_grad_boost: 1.0
  ordinal_reg_weight: 0.1

# Output
output:
  dir: "./checkpoints/stage1_multimodal"   # multi-modal run (T1 + fMRI + ASL + QSM + FLAIR)

# Reproducibility
seed: 42
