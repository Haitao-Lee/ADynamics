# =============================================================================
# ADynamics Stage 1: Multi-Modal VAE Training Configuration
# =============================================================================
# Trains the multi-modal encoder + lightweight decoder + classifier.
# Loss = recon + cls_weight * ordinal_ce + kl_weight * KL (with free bits) + 0.1 * ordinal_reg

# Data
data:
  json: "./core_data/dataset_manifest_merged_v2.json"
  num_classes: 4               # 4 = NC / SCD / MCI / AD (v6: keep all 4 stages for richer CFM transitions)
  optional_modalities: ["fmri", "asl", "qsm", "flair"]

# Model architecture
model:
  spatial_size: [256, 256, 192]  # [D, H, W]
  in_channels: 1
  latent_channels: 32
  base_channels: 16             # must match stage1 checkpoint (--base_channels 16)
  decoder_depth: 4
  dropout_rate: 0.2
  # Multi-axis 3D attention (NeuroQuant CVPR Findings 2026).
  # use_attention: true  -> add MultiAxisAttention3D after the specified
  #   encoder stages. The block is zero-initialized, so the first forward
  #   pass is bitwise identical to no-attention. The encoder params grow
  #   by ~4M (one block per modality encoder).
  # attention_levels: 1-indexed-by-stage numbers (0..3 for 4 downsample stages).
  #   (3) = bottleneck only. (2,3) = last two stages.
  use_attention: true
  attention_levels: [3]
  attention_heads: 8

# Training hyperparameters
training:
  batch_size: 2                # TOTAL batch size (each GPU gets 1 via DataParallel scatter)
  learning_rate: 0.00003        # reduced for stable retraining with stronger KL
  weight_decay: 0.00001
  epochs: 300
  early_stopping_patience: 50
  save_interval: 50
  num_gpus: 2                   # dual-GPU training (2x RTX 3090)
  use_amp: false               # v5: AMP caused NaN in VAE loss (KL+recon scale mismatch)

# Loss weights
loss:
  recon_loss_type: "l1"
  cls_weight: 1.0
  kl_weight: 0.3               # v7: reduced from 1.0 — Phase 0 diagnostics showed
                                # latent under-spread (std 0.02-0.08) because KL was
                                # too strong, compressing all class info to N(0,1) center
  kl_warmup_epochs: 30          # v5: longer warmup (was 20)
  free_bits: 0.05               # v7: raised from 0.01 — stronger floor prevents
                                # KL from collapsing any dimension below 0.05 nats
  contrastive_weight: 0.0       # v7: set to 0 (dead code in MultiModalVAETrainer —
                                # ordinal_contrastive_loss is not wired there).
                                # Making config honest rather than misleading.
  contrastive_temperature: 0.1 # NT-Xent temperature
  gradient_weight: 0.0          # optional: gradient loss on reconstruction
  ssim_weight: 0.0             # optional: SSIM loss
  encoder_grad_boost: 1.0       # v7: scale encoder gradients. Phase 0 found starvation
                                # (1/5x) but that was because fMRI was being discarded
                                # (4D→3D bug in dataset.py). With fMRI properly loaded,
                                # encoder grad is already 3.4x classifier grad. No boost needed.
                                # by this factor before clip_grad_norm.
                                # Phase 0 found encoder_t1 grad=0.87 vs classifier=4.4
                                # (1/5x). Boosting encoder grads lets it learn
                                # discriminative features instead of just matching prior.
  ordinal_reg_weight: 0.1       # v7: make configurable (was hardcoded 0.1 in trainer)

# Output
output:
  dir: "./checkpoints/stage1_multimodal"   # v6: 4-class + contrastive 0.3

# Reproducibility
seed: 42
