# =============================================================================
# ADynamics Stage 2a: Freeze Encoder, Train Classifier Head
# =============================================================================
# Validates that the Stage 1 encoder learned a discriminative latent space.

# Inputs
input:
  encoder_checkpoint: "./checkpoints/stage1_multimodal/vae_best.pt"
  num_classes: 4               # 4 = NC / SCD / MCI / AD (canonical, must match Stage 1)

# Training
training:
  batch_size: 8                # TOTAL batch size (each GPU gets 4 via DataParallel scatter)
  learning_rate: 0.0001
  weight_decay: 0.00001
  epochs: 100
  early_stopping_patience: 30
  num_gpus: 2
  use_amp: false

# Model dimensions (must match Stage 1)
model:
  latent_channels: 32
  base_channels: 16             # must match stage1 checkpoint (--base_channels 16)
  decoder_depth: 4
  in_channels: 1
  spatial_size: [256, 256, 192]
  dropout_rate: 0.2

# Output
output:
  dir: "./checkpoints/stage2_classifier"

# Reproducibility
seed: 42
